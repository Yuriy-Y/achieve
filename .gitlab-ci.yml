# CI/CD for the Achievement Tracker PWA (static site on GitLab Pages).
#
# Target instance: source.tui GitLab 19.5.1-ee, which serves each Pages site on a
# unique domain (e.g. https://achieve-f01113.pages.devops.tui) with no path prefix,
# so the base path is "/". The modern `pages: publish: dist` syntax is supported.
#
# - Merge requests and non-default branches: `test` (lint + Jest) and `build`.
# - Default branch (`main`): `pages` repeats lint and tests, builds and publishes
#   `dist/`, so a failing test never deploys.
# - vite.config.ts reads CI_PAGES_URL (via pagesBasePath.ts) to set the base path
#   (empty / "/" on this unique-domain instance; still supports path-style Pages).

default:
  image: node:22.14.0        # assumption: shared runners can pull this image (Docker Hub or company mirror)
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

stages: [test, build, pages]

test:
  stage: test
  script:
    - npm run lint
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: pages
  script:
    - npm run lint
    - npm test
    - npm run build            # vite.config.ts reads CI_PAGES_URL for the base path
  pages:
    publish: dist              # GitLab 17.9+ syntax, confirmed on the 19.5.x instance
  artifacts:
    paths: [dist]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
